<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151816" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Wenzhang's Home Page"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <title>Wenzhang's Home Page</title>
    <script type="text/javascript">
      // Apply the saved (or OS) color theme before the first paint; see src/components/ThemeToggle.tsx
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script type="text/javascript">
      // Restore the deep link that public/404.html turned into /?redirect=<path>
      (function () {
        var redirect = new URLSearchParams(window.location.search).get('redirect');
        if (redirect && redirect.charAt(0) === '/' && redirect.charAt(1) !== '/') {
          window.history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
