<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Single Page App</title>
  <script type="text/javascript">
    var l = window.location;
    if (l.pathname !== '/' && !l.pathname.match(/^\/index\.html/)) {
      l.replace('/?redirect=' + encodeURIComponent(l.pathname + l.search + l.hash));
    }
  </script>
</head>
<body></body>
</html>
